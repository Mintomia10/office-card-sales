
<!DOCTYPE html>
<html>
<head>
    <title>Card Sales</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #333;
            color: white;
        }

        tr:nth-child(even) {
            background: #f2f2f2;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Card Sales List</h1>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Operator</th>
                <th>Transaction Type</th>
                <th>Quantity</th>
                <th>Total Amount</th>
                <th>Date</th>
            </tr>
        </thead>

        <tbody>

        {% for sale in sales %}

            <tr>
                <td>{{ sale.id }}</td>
                <td>{{ sale.operator_name }}</td>
                <td>{{ sale.transaction_type }}</td>
                <td>{{ sale.card_quantity }}</td>
                <td>{{ sale.total_amount }}</td>
                <td>{{ sale.created_at }}</td>
            </tr>

        {% empty %}

            <tr>
                <td colspan="6">
                    No sales records found.
                </td>
            </tr>

        {% endfor %}

        </tbody>
    </table>

</div>

</body>
</html>
