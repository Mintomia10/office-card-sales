{% extends 'base.html' %}

{% block content %}

<div class="container py-4">

    <div class="card shadow-sm border-0">

        <div class="card-header bg-dark text-white">
            <h4 class="mb-0">
                {% if user %}
                    Edit Customer
                {% else %}
                    Add Customer
                {% endif %}
            </h4>
        </div>

        <div class="card-body">

            <form method="POST" enctype="multipart/form-data">

                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Customer Name</label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        value="{{ user.name|default:'' }}"
                        placeholder="Enter customer name"
                        required
                    >
                </div>


                <div class="mb-3">
                    <label class="form-label">Phone Number</label>

                    <input
                        type="text"
                        name="phone"
                        class="form-control"
                        value="{{ user.phone|default:'' }}"
                        placeholder="Enter phone number"
                    >
                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Customer Photo
                    </label>

                    <input
                        type="file"
                        name="photo"
                        class="form-control"
                        accept="image/*"
                    >

                </div>


                {% if user and user.photo %}

                    <div class="mb-3">

                        <p class="mb-2">
                            Current Photo
                        </p>

                        <img
                            src="{{ user.photo.url }}"
                            alt="{{ user.name }}"
                            width="120"
                            height="120"
                            class="rounded-circle border"
                            style="object-fit: cover;"
                        >

                    </div>

                {% endif %}


                <div class="d-flex gap-2">

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Save Customer
                    </button>

                    <a
                        href="{% url 'user_list' %}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
