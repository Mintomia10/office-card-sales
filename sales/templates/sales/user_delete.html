```html
<!DOCTYPE html>
<html>
<head>
    <title>Delete User</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 50px;
        }

        .box {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
            text-align: center;
        }

        .delete-btn {
            background: red;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        .cancel-btn {
            background: gray;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            margin-left: 10px;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>Delete User</h2>

    <p>
        Are you sure you want to delete
        <strong>{{ user }}</strong>?
    </p>

    <form method="POST">
        {% csrf_token %}

        <button type="submit" class="delete-btn">
            Yes, Delete
        </button>

        <a href="{% url 'user_list' %}" class="cancel-btn">
            Cancel
        </a>
    </form>

</div>

</body>
</html>
```
