<!DOCTYPE html>
<html>
<head>
    <title>Users</title>
</head>

<body>

<h1>Office Users</h1>

<a href="{% url 'dashboard' %}">
    Dashboard
</a>

<br><br>

<a href="{% url 'user_create' %}">
    + Add User
</a>

<br><br>

<table border="1" cellpadding="10">

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Phone</th>
    <th>Action</th>
</tr>

{% for user in users %}

<tr>

    <td>{{ user.id }}</td>

    <td>{{ user.name }}</td>

    <td>{{ user.phone }}</td>

    <td>

        <a href="{% url 'user_update' user.id %}">
            Edit
        </a>

        |

        <a href="{% url 'user_delete' user.id %}">
            Delete
        </a>

    </td>

</tr>

{% empty %}

<tr>
    <td colspan="4">
        No users found.
    </td>
</tr>

{% endfor %}

</table>

</body>
</html>
