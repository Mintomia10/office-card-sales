<!DOCTYPE html>
<html>
<head>
    <title>Card Sale</title>
</head>

<body>

<h1>
    {% if sale %}
        Edit Card Sale
    {% else %}
        Add Card Sale
    {% endif %}
</h1>

<form method="POST">

    {% csrf_token %}

    <label>User:</label>

    <select name="user" required>

        <option value="">
            Select User
        </option>

        {% for user in users %}

        <option
            value="{{ user.id }}"
            {% if sale.user.id == user.id %}
                selected
            {% endif %}
        >

            {{ user.name }}

        </option>

        {% endfor %}

    </select>

    <br><br>

    <label>Card Quantity:</label>

    <input
        type="number"
        name="card_quantity"
        min="1"
        value="{{ sale.card_quantity|default:'1' }}"
        required
    >

    <br><br>

    <p>
        Price per Card: ৳50
    </p>

    <button type="submit">
        Save Sale
    </button>

</form>

<br>

<a href="{% url 'sale_list' %}">
    Back
</a>

</body>
</html>
